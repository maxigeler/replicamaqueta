<!DOCTYPE html>
<html lang="en">
<head>

    <title>Plantilla 2 Maxi</title>
    <link rel="stylesheet" href="replica.css">
</head>
<body>
<article class="nav"
<div class="browser-window">

    <!-- 1. BARRA SUPERIOR -->

    <!-- 2. CONTENIDO PRINCIPAL -->

      <!-- Encabezado Amarillo (Hero) -->
      <header class="hero">
        <figure class="hero-avatar"></figure>
        <div class="hero-content">
          <h1 class="hero-title"></h1>
          <p></p>
          <p></p>
          <p></p>
          <p class="short"></p>
        </div>
      </header>

      <!-- Rejilla de Tarjetas -->
      <section class="cards-grid">
        <article class="card cyan"><header></header><div><span></span></div></article>
        <article class="card coral"><header></header><div><span></span></div></article>
        <article class="card yellow"><header></header><div><span></span></div></article>
        <article class="card yellow"><header></header><div><span></span></div></article>
        <article class="card cyan"><header></header><div><span></span></div></article>
        <article class="card coral"><header></header><div><span></span></div></article>
      </section>

    </main>

    <!-- 3. PIE DE PÁGINA (Footer) -->

      <section>
        <h2></h2>
        <p></p>
        <p></p>
        <p class="short"></p>
      </section>
      <section>
        <h2></h2>

      </section>
      <section>

</div>
